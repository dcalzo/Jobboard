<form action="/" method="GET">
    <fieldset>
        <Label>Como você avalia o seu contratante selecionado?</label>
        <select id="contratanteSel" name="contratanteSel" required>
            <option value="">Selecione um contratante</option>
            <% contratante.forEach(function(contratante) { %>
                <option value="<%=contratante.email%>"><%=contratante.nome || contratante.email%></option>
            <% }); %>
        </select>
        <div class="rating">
            <input type="radio" id="nota-5" name="nota" value="5" required>
            <label for="nota-5" aria-label="5 estrelas">★</label>
            <input type="radio" id="nota-4" name="nota" value="4">
            <label for="nota-4" aria-label="4 estrelas">★</label>
            <input type="radio" id="nota-3" name="nota" value="3">
            <label for="nota-3" aria-label="3 estrelas">★</label>
            <input type="radio" id="nota-2" name="nota" value="2">
            <label for="nota-2" aria-label="2 estrelas">★</label>
            <input type="radio" id="nota-1" name="nota" value="1">
            <label for="nota-1" aria-label="1 estrela">★</label>
        </div>
    </fieldset>
    <label for="comentarioConta">Deixe seu comentário:</label>
    <textarea id="comentarioConta" name="comentarioConta" rows="4" placeholder="Escreva sua opinião..."></textarea>
    <input type="submit" id="enviaNota" name="enviaNota" value="Enviar Avaliação" />
    <input type="hidden" id="typeuser" name="typeuser" value="<%=typeuser%>" />
    <input type="hidden" id="email" name="email" value="<%=email%>" />
    <input type="hidden" id="senha" name="senha" value="<%=senha%>" />
    <input type="hidden" id="menu" name="menu" value="ganho" />
</form>
