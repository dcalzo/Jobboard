<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="public/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <style>
    .about-page input,
    .about-page select,
    .about-page textarea {
      background-color: #e8f5e9;
      border-radius: 8px;
    }
    #cadastroPro {
      background-color: #3690f8;
    }
    </style>
    <title>Board Jobs (New Professional Account)</title>
  </head>
  <body class="about-page" style="background-color: #e8f5e9;">
    <br /> 
    <h1><b>Board</b></h1><br /> 
    <form>
      <table style="width: 100%;">
        <tr>
          <td style="width: 10%;">
            <div class="about-table" style="width: 100%;">
              <ul class="about-menu" style="margin-left: 0;">
                <li><a href="?opcao=login-pro">Professional Login</a></li>
                <li><a href="?opcao=login-cont">Contractor Login</a></li>
                <li><a href="?opcao=About">About</a></li>
                <li><a href="?opcao=home">Home</a></li>
              </ul>
            </div>
          </td>
          <td id="conteudo" name="conteudo" style="width: 90%;" >
            <%if (typeof savePressed !== "undefined" && savePressed && ficha.length != 0){%>
              <label style="-webkit-text-fill-color: rgb(4, 0, 255);"><h3><%=mensagem%></h3></label>
            <%}%>
            <br /> <br />
              <label>Professional Registration</label><br /><br />
              <div style="width:100%; height: 500px; overflow-y: scroll;"> 
                <input type="text" id="nome" name="nome" placeholder="First and last name" style="width: 50%;" value="<%=ficha[0]%>" required /><br />
                <input type="text" id="endereco" name="endereco" placeholder="Address" style="width: 50%;" value="<%=ficha[1]%>" required /><br />
                <input type="text" id="cidade" name="cidade" placeholder="City" style="width: 50%;" value="<%=ficha[2]%>" required />
                <input type="text" id="estado" name="estado" placeholder="State" style="width: 50%;" value="<%=ficha[3]%>" required />
                <input type="text" id="cep" name="cep" placeholder="ZIP / Postal Code" style="width: 50%;" value="<%=ficha[4]%>" required /><br />
                <input type="text" id="pais" name="pais" placeholder="Country" style="width: 50%;" value="<%=ficha[5]%>" required /><br />     
                <input type="text" id="rg" name="rg" placeholder="RG (Brazilian ID)" style="width: 50%;" value="<%=ficha[6]%>" required />
                <input type="text" id="cpf_cnpj" name="cpf_cnpj" placeholder="CPF or CNPJ" style="width: 50%;" value="<%=ficha[7]%>" required /><br />
                <input type="text" id="email" name="email" placeholder="E-Mail" style="width: 50%;" value="<%=ficha[8]%>" required /><br />
                <br />
                <input type="password" id="senha" name="senha" placeholder="Password" style="width: 50%;" value="<%=ficha[9]%>" required /><br />
                <input type="password" id="senha2" name="senha2" placeholder="Confirm Password" style="width: 50%;" value="<%=senha2 || ''%>" required /><br />
                <br />
                <%if(sexo == null || sexo == ""){%>
                  <select name="sexo" id="sexo" style="width: 200px;" onchange="this.form.submit()" required>
                    <option value="" selected >Select sex</option>
                    <option value="Masculino" >Male</option>
                    <option value="Feminino" >Female</option>
                  </select><br /><br />  
                <%}%>
                <%if(sexo == "Masculino"){%>
                  <select name="sexo" id="sexo" style="width: 200px;" onchange="this.form.submit()" required>
                    <option value="" >Select sex</option>
                    <option value="Masculino" selected >Male</option>
                    <option value="Feminino" >Female</option>
                  </select><br /><br /> 
                <%}%>
                <%if(sexo == "Feminino"){%>
                  <select name="sexo" id="sexo" style="width: 200px;" onchange="this.form.submit()" required>
                    <option value="" >Select sex</option>
                    <option value="Masculino" >Male</option>
                    <option value="Feminino" selected >Female</option>
                  </select><br /><br /> 
                <%}%>
                <input type="text" id="profissao" name="profissao" placeholder="Profession" style="width: 50%;" value="<%=ficha[11]%>" required /><br /><br />
                <label>Work Experience</label><br />
                <textarea id="historico" name="historico" placeholder="Work Experience" rows="10" cols="33" style="width: 50%;" required><%=ficha[12] || ""%></textarea><br />
                <label>Skills</label><br />
                <textarea id="conhecimento" name="conhecimento" placeholder="Skills" rows="10" cols="33" style="width: 50%;" required><%=ficha[13] || ""%></textarea><br />
                <br /><br />
                <input type="hidden" id="opcaoPag" name="opcaoPag" value="cadastroPro" />
                <input type="hidden" id="opcao" name="opcao" value="cadastroPro" />
                <input type="hidden" id="menu" name="menu" value="cadastroPro" />
                <input type="hidden" id="typeuser" name="typeuser" value="professional" />
                <input type="hidden" id="produto" name="produto" value="jobBoard" /> 
              </div>
              <br />
              <input type="submit" id="cadastroPro" name="cadastroPro" value="Save" style="width: 50%;" />
              <br />
            </td>
          </tr>
        </table>
     </form> 
    <script>
      const password = document.getElementById("senha");
      const passwordConfirmation = document.getElementById("senha2");
      const validatePasswordMatch = () => {
        const passwordsDiffer = passwordConfirmation.value !== password.value;
        passwordConfirmation.setCustomValidity(
          passwordConfirmation.value && passwordsDiffer ? "Passwords do not match." : ""
        );
      };

      password.addEventListener("input", validatePasswordMatch);
      passwordConfirmation.addEventListener("input", validatePasswordMatch);
    </script>
  </body>
</html>
