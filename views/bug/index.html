<html>
    <head>
      <meta charset="utf-8">
      <link rel="icon" type="image/svg+xml" href="/images/logo-caju.svg">
      <link href="public/style.css" rel="stylesheet">
      <title>board jobs</title>
    </head>
    <body class="caju-products-page bug-report-page">
      <h1><b>report bugs</b></h1><br />  
      <form>
        <table style="width: 100%;">
          <tr>
            <td style="width: 20%;">
              <% if(typeuser === "contractor") { %>
              <%- include('../menu/menu.html') %>
              <% } else { %>
              <%- include('../menuProfissional/menuProfissional.html') %>
              <% } %>
            </td>
            <td id="conteudo" name="conteudo" style="width: 80%;" >
              <label>Describe how the bug is occurring and on which page it is taking place.</label>
                <table>
                  <tr>
                    <td>
                      <br />    
                      <input type="text" name="bug" id="bug" style="width: 100%;" placeholder="Bug Subject"></input>                      
                    </td>
                  </tr>
                  <tr>
                    <td>   
                      <br />
                      <textarea name="bugDescription" id="bugDescription" style="width: 100%; height: 250px;" placeholder="Bug Description">                        
                      </textarea>                       
                    </td>
                  </tr>
                  <tr>
                    <td>   
                      <br />
                      <input type="hidden" name="email" id="email" value="<%=email%>" />
                      <input type="hidden" name="senha" id="senha" value="<%=senha%>" />
                      <input type="hidden" name="typeuser" id="typeuser" value="<%=typeuser%>" />
                      <input type="hidden" name="menu" id="menu" value="bug" />
                      <input type="submit" name="bugReport" id="bugReport" value="Submit Bug Report" style="width: 50%; background-color: #395ef5; color: white; font-size: 20px;" />                      
                    </td>
                  </tr>
                </table>
            </td>
          </tr>
        </table>    
      </form>    
      <% if (mensagemBug) { %>
        <p class="payment-save-success" role="status" aria-live="polite"><%= mensagemBug %></p>
        <script>
          window.setTimeout(function() {
            var message = document.querySelector(".bug-report-page .payment-save-success");
            if (message) message.remove();
          }, 5000);
        </script>
      <% } %>
    </body>
</html>
